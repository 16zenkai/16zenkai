<svg width="1200" height="160" viewBox="0 0 1200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="160" fill="#0a0a0a"/>

  <!-- Animated red glow line top -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle grid lines -->
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#FF3333" stroke-width="0.2" stroke-opacity="0.15"/>
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#FF3333" stroke-width="0.2" stroke-opacity="0.15"/>
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#FF3333" stroke-width="0.2" stroke-opacity="0.15"/>
  <line x1="300" y1="0" x2="300" y2="160" stroke="#FF3333" stroke-width="0.2" stroke-opacity="0.15"/>
  <line x1="600" y1="0" x2="600" y2="160" stroke="#FF3333" stroke-width="0.2" stroke-opacity="0.15"/>
  <line x1="900" y1="0" x2="900" y2="160" stroke="#FF3333" stroke-width="0.2" stroke-opacity="0.15"/>

  <!-- Red glow orb behind name -->
  <ellipse cx="600" cy="80" rx="220" ry="60" fill="#FF3333" fill-opacity="0.06">
    <animate attributeName="rx" values="200;240;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.04;0.09;0.04" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ZENKAI text -->
  <text
    x="600"
    y="76"
    font-family="'Courier New', monospace"
    font-size="72"
    font-weight="900"
    letter-spacing="18"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
    opacity="0"
  >
    ZENKAI
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- Red underline accent animated -->
  <rect x="380" y="108" width="0" height="2" fill="url(#lineGrad)" rx="1">
    <animate attributeName="width" values="0;440" dur="0.8s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="x" values="600;380" dur="0.8s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- Subtitle -->
  <text
    x="600"
    y="132"
    font-family="'Courier New', monospace"
    font-size="11"
    letter-spacing="5"
    fill="#FF3333"
    text-anchor="middle"
    opacity="0"
  >
    FULL STACK DEVELOPER  ·  DISCORD BOTS  ·  CUSTOM TOOLS
    <animate attributeName="opacity" values="0;0.85" dur="0.6s" begin="1.1s" fill="freeze"/>
  </text>

  <!-- Corner brackets TL -->
  <path d="M 20 20 L 20 10 L 30 10" stroke="#FF3333" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>
  <!-- Corner brackets TR -->
  <path d="M 1180 20 L 1180 10 L 1170 10" stroke="#FF3333" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>
  <!-- Corner brackets BL -->
  <path d="M 20 140 L 20 150 L 30 150" stroke="#FF3333" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>
  <!-- Corner brackets BR -->
  <path d="M 1180 140 L 1180 150 L 1170 150" stroke="#FF3333" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>

  <!-- Animated red glow line bottom -->
  <rect x="0" y="158" width="1200" height="2" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </rect>

  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="30%" stop-color="#FF3333"/>
      <stop offset="70%" stop-color="#FF3333"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
</svg>
